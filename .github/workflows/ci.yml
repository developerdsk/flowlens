name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        shell: bash
        run: ./mvnw -B verify
      - name: Upload engine jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: flowlens-analyzer-jar
          path: analyzer/target/flowlens-analyzer.jar

  viewer-e2e:
    name: Viewer end-to-end
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: flowlens-analyzer-jar
          path: analyzer/target
      - name: Install Playwright Chromium
        working-directory: viewer
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
      - name: Run e2e
        working-directory: viewer
        run: npm run e2e

  desktop-check:
    name: Desktop shell builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Build engine + prepare
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-engine.mjs
          node scripts/prepare.mjs
      - name: Rust tests, lint and build
        working-directory: desktop/src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings
          cargo build --locked
