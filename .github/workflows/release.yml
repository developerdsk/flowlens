# Builds installable desktop apps and publishes them as a GitHub Release, so people can download
# FlowLens without building it:
#
#   - every push to main (i.e. every merged PR) -> release v<version>-build.<run>, marked "Latest"
#   - a v* tag (git tag v0.3.0 && git push origin v0.3.0) -> release named after the tag
#   - run manually from the Actions tab: on main it publishes; on any other branch it stays a draft
#     (a test build only collaborators can see)
#
# The release is created as a draft, every platform uploads into it, and it is published only when
# all of them succeed. If any build fails or the run is cancelled, the draft is deleted.
#
# Version: <version> comes from analyzer/pom.xml, the app's single version source.
#
# Unsigned by default. Add these repository secrets to switch signing on:
#   macOS (Developer ID + notarization):
#     APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#     APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#   Windows (Authenticode, .pfx):
#     WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   Auto-update (Tauri updater signatures, see desktop/README.md):
#     TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: Release desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
    # docs-only merges don't produce a new app (path filters are ignored for tag pushes)
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the release
        id: meta
        shell: bash
        run: |
          version=$(node -p "/<artifactId>flowlens-analyzer<\/artifactId>\s*(?:<!--[\s\S]*?-->\s*)?<version>([^<]+)<\/version>/.exec(require('fs').readFileSync('analyzer/pom.xml','utf8'))[1]")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"; name="FlowLens ${GITHUB_REF_NAME#v}"
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"; name="FlowLens ${version} (build ${GITHUB_RUN_NUMBER})"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: process.env.NAME,
              draft: true,
              generate_release_notes: true,
              body: [
                'Download the installer for your computer from **Assets** below:',
                '- **Windows**: `FlowLens_*_x64-setup.exe` (or the `.msi`)',
                '- **Mac with Apple Silicon (M1–M4)**: `FlowLens_*_aarch64.dmg`',
                '- **Mac with Intel**: `FlowLens_*_x64.dmg`',
                '- **Linux**: `.AppImage` or `.deb`',
                '',
                'No Java installation is needed. Builds are not code-signed yet: on macOS right-click the app → **Open** the first time; on Windows choose **More info → Run anyway**.',
                '',
                `Built from ${context.sha.slice(0, 7)}.`,
              ].join('\n'),
            });
            return data.id;

  build:
    name: ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            java-arch: x64
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            java-arch: aarch64
          - name: macOS Intel
            # GitHub's Intel macOS runner. If it is retired, build on macos-14 instead with
            # target x86_64-apple-darwin and FLOWLENS_JMODS pointing at an x64 JDK's jmods.
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            java-arch: x64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            java-arch: x64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java-arch }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Test engine
        shell: bash
        working-directory: analyzer
        run: |
          ./mvnw -v || (sleep 15 && ./mvnw -v)
          ./mvnw -B verify

      - name: Build engine (jar + minimal Java runtime)
        shell: bash
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          SKIP_JAR=1 node scripts/build-engine.mjs

      - name: Sign the bundled Java runtime (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        working-directory: desktop
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/macos-sign-runtime.sh

      - name: Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        working-directory: desktop
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/windows-signing.ps1

      - name: Choose optional features
        id: features
        shell: bash
        working-directory: desktop
        run: |
          args="--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && ! grep -q REPLACE_WITH src-tauri/tauri.updater.conf.json; then
            args="$args --features updater --config src-tauri/tauri.updater.conf.json"
            echo "updater=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f src-tauri/tauri.windows-signing.conf.json ]; then
            args="$args --config src-tauri/tauri.windows-signing.conf.json"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Linux AppImage: lets linuxdeploy resolve the bundled JRE's own libraries (libjvm.so)
          LD_LIBRARY_PATH: ${{ github.workspace }}/desktop/src-tauri/engine/runtime/lib/server:${{ github.workspace }}/desktop/src-tauri/engine/runtime/lib
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: ${{ steps.features.outputs.args }}
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: ${{ steps.features.outputs.updater == 'true' }}

  publish:
    name: Publish release
    needs: [release, build]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });

  discard:
    name: Delete draft after a failed build
    needs: [release, build]
    if: (failure() || cancelled()) && needs.release.outputs.id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.deleteRelease({ ...context.repo, release_id: Number(process.env.RELEASE_ID) });
