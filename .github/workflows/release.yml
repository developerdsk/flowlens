# Every push to main publishes the next patch version; v* tags publish that exact version.
# Versioning, signing secrets and auto-update: see desktop/README.md (Releases).
name: Release desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.result }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        id: meta
        shell: bash
        run: |
          semver_max() { sort -t. -k1,1n -k2,2n -k3,3n | tail -1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(node -p "/<artifactId>flowlens-analyzer<\/artifactId>\s*(?:<!--[\s\S]*?-->\s*)?<version>([^<]+)<\/version>/.exec(require('fs').readFileSync('analyzer/pom.xml','utf8'))[1]")
            latest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | semver_max || true)
            next="$base"
            if [ -n "$latest" ]; then IFS=. read -r major minor patch <<< "$latest"; next="$major.$minor.$((patch + 1))"; fi
            version=$(printf '%s\n%s\n' "$base" "$next" | semver_max)
          fi
          echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$version' is not X.Y.Z"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            tag="v$version"; name="FlowLens $version"
          else
            tag="v$version-test.$GITHUB_RUN_NUMBER"; name="FlowLens $version (test build from $GITHUB_REF_NAME)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $version, tag $tag"

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: process.env.NAME,
              draft: true,
              generate_release_notes: true,
              body: [
                'Download the installer for your computer from **Assets** below:',
                '- **Windows**: `FlowLens_*_x64-setup.exe` (or the `.msi`)',
                '- **Mac with Apple Silicon (M1–M4)**: `FlowLens_*_aarch64.dmg`',
                '- **Mac with Intel**: `FlowLens_*_x64.dmg`',
                '- **Linux**: `.AppImage` or `.deb`',
                '',
                'No Java installation is needed.',
                '',
                'Builds are not code-signed yet, so the first launch needs one extra step:',
                '- **macOS**: open FlowLens once and close the warning, then go to **System Settings → Privacy & Security** and click **Open Anyway** (or run `xattr -dr com.apple.quarantine /Applications/FlowLens.app`).',
                '- **Windows**: in the SmartScreen prompt choose **More info → Run anyway**.',
                '',
                `Built from ${context.sha.slice(0, 7)}.`,
              ].join('\n'),
            });
            return data.id;

  build:
    name: ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            java-arch: x64
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            java-arch: aarch64
          - name: macOS Intel
            # If GitHub retires this runner, cross-build on macos-14 (see desktop/README.md)
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            java-arch: x64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            java-arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # Flags only: the bundler treats a signing variable that exists, even empty, as "sign"
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set the release version (${{ needs.release.outputs.version }})
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          node -e "
            const fs = require('fs'), f = 'analyzer/pom.xml', s = fs.readFileSync(f, 'utf8');
            const re = /(<artifactId>flowlens-analyzer<\/artifactId>\s*(?:<!--[\s\S]*?-->\s*)?<version>)[^<]+(<\/version>)/;
            if (!re.test(s)) throw new Error('version not found in ' + f);
            fs.writeFileSync(f, s.replace(re, '\$1' + process.env.VERSION + '\$2'));
          "
          grep -m1 -A3 '<artifactId>flowlens-analyzer' analyzer/pom.xml | grep '<version>'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java-arch }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Test engine
        shell: bash
        working-directory: analyzer
        run: |
          ./mvnw -v || (sleep 15 && ./mvnw -v)
          ./mvnw -B verify

      - name: Build engine (jar + minimal Java runtime)
        shell: bash
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          SKIP_JAR=1 node scripts/build-engine.mjs

      - name: Sign the bundled Java runtime (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/macos-sign-runtime.sh

      - name: Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        working-directory: desktop
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/windows-signing.ps1

      - name: Choose optional features
        id: features
        shell: bash
        working-directory: desktop
        run: |
          args="--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}"
          if [ "$HAS_UPDATER_KEY" = true ] && ! grep -q REPLACE_WITH src-tauri/tauri.updater.conf.json; then
            args="$args --features updater --config src-tauri/tauri.updater.conf.json"
            echo "updater=true" >> "$GITHUB_OUTPUT"
          fi
          # Without a certificate, ad-hoc sign or Apple Silicon reports the app as "damaged"
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_APPLE_CERT" != true ]; then
            args="$args --config src-tauri/tauri.macos-adhoc.conf.json"
          fi
          if [ -f src-tauri/tauri.windows-signing.conf.json ]; then
            args="$args --config src-tauri/tauri.windows-signing.conf.json"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Hand signing secrets to the bundler (only those that are set)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pass() { for v in "$@"; do [ -n "${!v}" ] && printf '%s<<__FLOWLENS_EOF__\n%s\n__FLOWLENS_EOF__\n' "$v" "${!v}" >> "$GITHUB_ENV"; done; true; }
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_APPLE_CERT" = true ]; then
            pass APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [ "$HAS_UPDATER_KEY" = true ]; then pass TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # lets linuxdeploy find the bundled JRE's libjvm.so for the AppImage
          LD_LIBRARY_PATH: ${{ github.workspace }}/desktop/src-tauri/engine/runtime/lib/server:${{ github.workspace }}/desktop/src-tauri/engine/runtime/lib
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: ${{ steps.features.outputs.args }}
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: ${{ steps.features.outputs.updater == 'true' }}

  publish:
    name: Publish release
    needs: [release, build]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });

  discard:
    name: Delete draft after a failed build
    needs: [release, build]
    if: (failure() || cancelled()) && needs.release.outputs.id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.deleteRelease({ ...context.repo, release_id: Number(process.env.RELEASE_ID) });
