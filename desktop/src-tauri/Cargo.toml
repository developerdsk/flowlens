[package]
name = "flowlens"
version = "0.2.0"
description = "FlowLens desktop app: static request-flow graphs for Java"
authors = ["FlowLens contributors"]
license = "Apache-2.0"
repository = "https://github.com/developerdsk/flowlens"
edition = "2021"
rust-version = "1.77"

[lib]
name = "flowlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ureq = { version = "2", default-features = false }
getrandom = "0.2"
base64 = "0.22"
url = "2"

[features]
# Auto-update support. Enabled by the release workflow only when an updater signing key is configured.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
